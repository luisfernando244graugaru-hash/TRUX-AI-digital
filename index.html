<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>TRUX AI</title>
<style>
/* Layout: auth card on a glow field; app = fixed sidebar + chat column with floating composer. Palette is graphite + one hot orange. */
:root{
  --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#0c0c0d; --side:#0f0f10; --surface:#141415; --surface-2:#1a1a1c; --surface-3:#232326;
  --line:#242427; --line-2:#303035; --fg:#f4f4f5; --fg-2:#c9c9ce; --muted:#8f8f96;
  --accent:#ff6a00; --accent-text:#ff8a3d; --on-accent:#1a0d00; --ring:rgba(255,106,0,.45); --glow:rgba(255,106,0,.18);
  --code:#09090a; --danger:#ff6b6b; --danger-bg:rgba(255,107,107,.12); --shadow:0 18px 50px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.62);
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f6f7; --side:#f0f0f2; --surface:#ffffff; --surface-2:#eeeef0; --surface-3:#e4e4e8;
    --line:#e3e3e7; --line-2:#d2d2d8; --fg:#18181b; --fg-2:#3f3f46; --muted:#6f6f78;
    --accent:#ff6a00; --accent-text:#c2480a; --on-accent:#1a0d00; --ring:rgba(255,106,0,.55); --glow:rgba(255,106,0,.12);
    --code:#f1f1f3; --danger:#d93636; --danger-bg:rgba(217,54,54,.1); --shadow:0 18px 50px rgba(20,20,30,.16); --scrim:rgba(20,20,30,.45);
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f6f7; --side:#f0f0f2; --surface:#ffffff; --surface-2:#eeeef0; --surface-3:#e4e4e8;
  --line:#e3e3e7; --line-2:#d2d2d8; --fg:#18181b; --fg-2:#3f3f46; --muted:#6f6f78;
  --accent:#ff6a00; --accent-text:#c2480a; --on-accent:#1a0d00; --ring:rgba(255,106,0,.55); --glow:rgba(255,106,0,.12);
  --code:#f1f1f3; --danger:#d93636; --danger-bg:rgba(217,54,54,.1); --shadow:0 18px 50px rgba(20,20,30,.16); --scrim:rgba(20,20,30,.45);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:16px;height:16px}.ic.lg{width:26px;height:26px}
[hidden]{display:none!important}

/* logo mark */
.mark{display:grid;place-items:center;border:1.5px solid var(--accent);color:var(--accent);font-weight:700;background:color-mix(in srgb,var(--accent) 8%,transparent);box-shadow:0 0 22px var(--glow);width:30px;height:30px;border-radius:9px;font-size:15px;line-height:1;flex:none}
.mark.xl{width:52px;height:52px;border-radius:15px;font-size:24px}
.mark.md{width:40px;height:40px;border-radius:12px;font-size:19px}
.mark.sm{width:28px;height:28px;border-radius:9px;font-size:14px;box-shadow:none}

/* ---------- auth ---------- */
#auth{height:100%;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;
  background:radial-gradient(60% 40% at 30% -5%,var(--glow),transparent 70%),radial-gradient(45% 35% at 100% 105%,var(--glow),transparent 70%),var(--bg)}
.acard{width:min(400px,100%);background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:34px 32px 30px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center}
.acard h1{margin:22px 0 8px;font-size:26px;font-weight:700;letter-spacing:-.01em;text-wrap:balance;text-align:center}
.acard .sub{margin:0 0 24px;color:var(--muted);text-align:center;text-wrap:balance}
.acard form{width:100%;display:flex;flex-direction:column;gap:6px}
.fl{font-size:13px;font-weight:600;margin-top:10px}
.field{position:relative;display:flex}
.inp{width:100%;height:48px;padding:0 16px;background:var(--surface-2);border:1px solid var(--line-2);border-radius:14px;outline:none;font-size:15px;transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:var(--muted)}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--glow)}
.inp[readonly],.inp:disabled{opacity:.65;cursor:not-allowed}
.field .inp{padding-right:48px}
.eye{position:absolute;right:6px;top:50%;translate:0 -50%;width:36px;height:36px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:10px}
.eye:hover{color:var(--fg)}
.btn{height:46px;border:0;border-radius:14px;background:var(--accent);color:var(--on-accent);font-weight:700;font-size:15px;transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.6;cursor:progress}
.btn.full{width:100%;margin-top:18px}
.btn.sm{height:36px;padding:0 16px;font-size:13.5px;border-radius:11px}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line-2);font-weight:600}
.btn.danger{background:var(--danger-bg);color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.msgerr{min-height:0;margin-top:10px;color:var(--danger);font-size:13px;text-align:center}
.swap{margin:18px 0 0;color:var(--muted);text-align:center}
.lnk{background:none;border:0;padding:0;color:var(--accent-text);font-weight:600}
.lnk:hover{text-decoration:underline}
.afoot{color:var(--muted);font-size:12.5px;letter-spacing:.02em}
.afoot a{color:var(--muted);text-decoration:underline}
.afoot a:hover{color:var(--fg)}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;overflow:hidden}
#side{width:272px;flex:none;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;transition:margin-left .22s ease;min-height:0}
#app.collapsed #side{margin-left:-272px}
.sh{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.16em;font-size:14px}
.iconbtn{width:36px;height:36px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:10px;flex:none}
.iconbtn:hover{background:var(--surface-3);color:var(--fg)}
.sbody{padding:4px 16px 8px;display:flex;flex-direction:column;gap:8px}
.newchat{display:flex;align-items:center;gap:12px;height:40px;padding:0 8px;border:0;background:none;border-radius:10px;font-weight:500;font-size:14.5px;text-align:left}
.newchat:hover{background:var(--surface-3)}
.newchat .ic{color:var(--fg-2)}
.srch{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;background:var(--surface-2);border-radius:12px;color:var(--muted)}
.srch input{flex:1;min-width:0;border:0;background:none;outline:none;font-size:14px}
.srch input::placeholder{color:var(--muted)}
.srch:focus-within{box-shadow:0 0 0 2px var(--ring)}
#chats{flex:1;overflow:auto;padding:6px 16px 12px;min-height:0}
.grp{font-size:12px;font-weight:600;color:var(--muted);padding:14px 8px 6px}
.ci{display:flex;align-items:center;gap:4px;height:40px;padding:0 4px 0 10px;border-radius:10px;cursor:pointer}
.ci:hover,.ci.on{background:var(--surface-3)}
.ci .ct{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.ci .cm{opacity:0;width:30px;height:30px;display:grid;place-items:center;border:0;background:none;color:var(--muted);border-radius:8px}
.ci:hover .cm,.ci.on .cm,.ci .cm:focus-visible{opacity:1}
.ci .cm:hover{color:var(--fg);background:var(--surface-2)}
.ci input{flex:1;min-width:0;height:30px;border:1px solid var(--accent);background:var(--surface);border-radius:8px;padding:0 8px;outline:none;font-size:14px}
.empty{padding:22px 8px;color:var(--muted);font-size:13.5px}
.sfoot{border-top:1px solid var(--line);padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px))}
.me{display:flex;align-items:center;gap:12px;width:100%;padding:8px;border:0;background:none;border-radius:12px;text-align:left}
.me:hover{background:var(--surface-3)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:700;flex:none}
.me .who{flex:1;min-width:0;line-height:1.25}
.me .who b{display:block;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me .who span{color:var(--muted);font-size:13px}
.me .ic{color:var(--muted)}

#main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative;background:var(--bg)}
#top{display:flex;align-items:center;gap:6px;height:56px;padding:0 16px;flex:none}
#top .grow{flex:1}
#openSide,#newTop{display:none}
#app.collapsed #openSide,#app.collapsed #newTop{display:grid}
.modelbtn{display:flex;align-items:center;gap:6px;height:38px;padding:0 10px;border:0;background:none;border-radius:10px;font-size:17px;font-weight:600;letter-spacing:-.005em}
.modelbtn:hover,.modelbtn[aria-expanded="true"]{background:var(--surface-2)}
.modelbtn .ic{color:var(--muted)}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;scroll-behavior:auto}
.col{width:100%;max-width:792px;margin:0 auto;padding:0 16px}

/* welcome */
#welcome{display:flex;flex-direction:column;align-items:center;padding-top:clamp(24px,9vh,96px);padding-bottom:24px;text-align:center}
#welcome h2{margin:22px 0 8px;font-size:30px;font-weight:700;letter-spacing:-.015em;text-wrap:balance}
#welcome p{margin:0 0 30px;color:var(--muted);font-size:16px}
.sugs{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:648px;text-align:left}
.sug{display:flex;gap:12px;align-items:flex-start;padding:15px 16px;background:transparent;border:1px solid var(--line-2);border-radius:16px;text-align:left;transition:background .15s,border-color .15s}
.sug:hover{background:var(--surface-2);border-color:var(--line-2)}
.sug .ic{color:var(--accent-text);margin-top:2px}
.sug b{display:block;font-size:14.5px;font-weight:600;margin-bottom:2px}
.sug span{display:block;color:var(--muted);font-size:13.5px;line-height:1.45}

/* messages */
#msgs{display:flex;flex-direction:column;gap:24px;padding:12px 16px 28px}
.msg.u{align-self:flex-end;max-width:min(84%,580px);display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.tag{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--accent-text);font-weight:500}
.tag .ic{width:14px;height:14px}
.bubble{background:var(--surface-3);padding:10px 16px;border-radius:20px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px;line-height:1.55}
.atts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.athumb{width:84px;height:84px;border-radius:12px;object-fit:cover;border:1px solid var(--line-2)}
.achip{display:inline-flex;align-items:center;gap:6px;max-width:220px;padding:6px 10px;border:1px solid var(--line-2);border-radius:10px;font-size:13px;color:var(--fg-2)}
.achip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg.b{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px;align-items:start}
.msg.b .mark{margin-top:2px}
.body{min-width:0}
.md{font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.md>:first-child{margin-top:0}.md>:last-child{margin-bottom:0}
.md p{margin:0 0 .85em}
.md h1,.md h2,.md h3,.md h4{line-height:1.3;margin:1.3em 0 .5em;letter-spacing:-.01em;text-wrap:balance}
.md h1{font-size:23px}.md h2{font-size:20px;font-weight:650}.md h3{font-size:17px}.md h4{font-size:15px}
.md ul,.md ol{margin:0 0 .85em;padding-left:1.4em}
.md li{margin:.25em 0}.md li>ul,.md li>ol{margin:.25em 0 .25em}
.md li::marker{color:var(--muted)}
.md a{color:var(--accent-text);text-decoration:underline;text-underline-offset:3px}
.md strong{font-weight:650}
.md hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}
.md blockquote{margin:0 0 .85em;padding:6px 18px;border-left:3px solid var(--accent);color:var(--fg-2);background:color-mix(in srgb,var(--accent) 4%,transparent);border-radius:0 8px 8px 0}
.md blockquote p{margin:0}
.md :not(pre)>code{font-family:var(--mono);font-size:.86em;background:var(--surface-3);padding:2px 6px;border-radius:6px}
.codeblock{margin:0 0 1em;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--code)}
.chead{display:flex;align-items:center;justify-content:space-between;padding:6px 8px 6px 16px;background:var(--surface);border-bottom:1px solid var(--line);font:12px var(--mono);color:var(--muted)}
.cbtn{border:0;background:none;color:var(--muted);font:12.5px var(--font);padding:5px 10px;border-radius:8px}
.cbtn:hover{color:var(--fg);background:var(--surface-3)}
.codeblock pre{margin:0;padding:14px 16px;overflow-x:auto;font:13px/1.7 var(--mono);tab-size:2}
.codeblock pre code{background:none;padding:0;font:inherit}
.tw{margin:0 0 1em;overflow-x:auto;border:1px solid var(--line);border-radius:14px}
.tw table{border-collapse:collapse;width:100%;font-size:14px}
.tw th,.tw td{padding:10px 16px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.tw th{background:var(--surface);font-weight:600}
.tw tr:last-child td{border-bottom:0}
.think{display:flex;gap:5px;align-items:center;height:28px}
.think i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.1s infinite ease-in-out}
.think i:nth-child(2){animation-delay:.15s}.think i:nth-child(3){animation-delay:.3s}
@keyframes pulse{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
.note{margin-top:8px;font-size:13px;color:var(--muted)}
.errbox{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--danger-bg);color:var(--danger);font-size:14px}
.acts{display:flex;gap:2px;margin:8px 0 0 -8px}
.acts .iconbtn{width:32px;height:32px}
.acts .iconbtn.on{color:var(--accent-text)}

/* generated image */
.imgcard{width:min(440px,100%);aspect-ratio:1/1.08;position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column}
.imgcard>.gen{flex:1;min-height:0;width:100%;object-fit:cover;display:block;background:var(--surface-2)}
.cap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;font-size:13px;color:var(--fg-2);background:var(--surface);border-top:1px solid var(--line)}
.cap span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.open{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent-text);font-weight:700;font-size:13px;flex:none;padding:4px 6px;border-radius:8px}
.open:hover{background:var(--surface-3)}
.imgmid{flex:1;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;color:var(--muted);padding:20px;text-align:center}
.imgcard.loading .shim{flex:1;background:linear-gradient(110deg,var(--surface-2) 30%,var(--surface-3) 50%,var(--surface-2) 70%);background-size:220% 100%;animation:sh 1.5s infinite linear}
@keyframes sh{to{background-position:-220% 0}}
.imglabel{position:absolute;left:0;right:0;top:50%;translate:0 -50%;display:flex;gap:8px;justify-content:center;align-items:center;color:var(--fg-2);font-weight:500}

/* composer */
#comp{flex:none;padding:6px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.cwrap{max-width:792px;margin:0 auto}
.cbox{background:var(--surface);border:1px solid var(--line-2);border-radius:26px;padding:14px 14px 10px 18px;transition:border-color .15s,box-shadow .15s;box-shadow:0 0 28px rgba(255,106,0,.05)}
.cbox:focus-within{border-color:var(--ring);box-shadow:0 0 0 3px var(--glow)}
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
#chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:8px;max-width:240px;padding:5px 6px 5px 10px;border:1px solid var(--line-2);border-radius:999px;font-size:13px;background:var(--surface-2)}
.chip.img{color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}
.chip img{width:24px;height:24px;border-radius:6px;object-fit:cover}
.chip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip button{display:grid;place-items:center;width:20px;height:20px;border:0;border-radius:50%;background:none;color:var(--muted)}
.chip button:hover{background:var(--surface-3);color:var(--fg)}
#ta{display:block;width:100%;border:0;background:none;outline:none;resize:none;font-size:15.5px;line-height:1.5;max-height:200px;min-height:24px;padding:0}
#ta::placeholder{color:var(--muted)}
.crow{display:flex;align-items:center;justify-content:space-between;margin-top:6px}
.crow .r{display:flex;align-items:center;gap:6px}
.crow .iconbtn{width:38px;height:38px;border-radius:50%}
.crow .iconbtn.on{color:var(--accent-text);background:var(--glow)}
#send{width:38px;height:38px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--surface-3);color:var(--muted);transition:background .15s,color .15s}
#send:not([disabled]){background:var(--fg);color:var(--bg)}
#send[disabled]{cursor:default}
.disc{margin:8px 0 0;text-align:center;color:var(--muted);font-size:12.5px}

/* popovers, toast, modal */
.pop{position:fixed;z-index:60;min-width:220px;max-width:calc(100vw - 16px);background:var(--surface);border:1px solid var(--line-2);border-radius:16px;padding:6px;box-shadow:var(--shadow)}
.pi{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;background:none;border-radius:10px;text-align:left;font-size:14px}
.pi:hover{background:var(--surface-2)}
.pi .ic{color:var(--fg-2)}
.pi.danger,.pi.danger .ic{color:var(--danger)}
.pi .t{flex:1;min-width:0;line-height:1.35}
.pi .t small{display:block;color:var(--muted);font-size:12.5px}
.pi .ok{color:var(--accent-text)}
.psep{height:1px;background:var(--line);margin:6px 4px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:90;max-width:calc(100vw - 32px);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow);animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;translate:-50% 8px}}
.ov{position:fixed;inset:0;z-index:80;background:var(--scrim);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));backdrop-filter:blur(3px)}
.dlg{width:min(560px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 26px 26px;box-shadow:var(--shadow)}
.dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.dh h3{margin:0;font-size:19px}
.sec{border-top:1px solid var(--line);padding:18px 0 4px;margin-top:18px}
.sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
.sec h4{margin:0 0 12px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.dlg .fl{margin:12px 0 6px}
.dlg .fl:first-of-type{margin-top:0}
.dlg .btn.sm{margin-top:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.row .t b{display:block;font-weight:500;font-size:15px}
.row .t span{color:var(--muted);font-size:13px}
.seg{display:flex;padding:3px;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:9px;font-size:13.5px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface-3);color:var(--fg)}
.fmsg{font-size:13px;margin-top:8px;min-height:0}
.fmsg.bad{color:var(--danger)}.fmsg.good{color:#3fb97a}
.lb{display:flex;flex-direction:column;gap:14px;align-items:center;max-width:min(92vw,720px);max-height:100%}
.lb img{max-width:100%;max-height:calc(100vh - 150px);border-radius:16px;background:var(--surface-2)}
.lb .bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

#drawerov{display:none}

/* ---------- mobile ---------- */
@media (max-width:820px){
  #side{position:fixed;z-index:70;left:0;top:0;bottom:0;width:min(88vw,340px);margin-left:0!important;transform:translateX(-102%);transition:transform .25s ease;padding-top:env(safe-area-inset-top,0px);box-shadow:var(--shadow)}
  #app.drawer #side{transform:none}
  #drawerov{display:block;position:fixed;inset:0;z-index:65;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .25s}
  #app.drawer #drawerov{opacity:1;pointer-events:auto}
  #openSide,#newTop{display:grid!important}
  #top{padding:0 8px}
  .sugs{grid-template-columns:1fr}
  #welcome h2{font-size:27px}
  .msg.u{max-width:90%}
  .msg.b{grid-template-columns:minmax(0,1fr)}
  .msg.b>.mark{display:none}
  .ci .cm{opacity:1}
  .dlg{padding:20px 18px 22px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.3.0/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<script>
(function(){
'use strict';
/* ================= config ================= */
const DISCORD_URL='https://discord.com';
const MODELS={
  rapido:{name:'TRUX Rápido',desc:'Respostas rápidas para o dia a dia',icon:'bolt',tier:'quick',extra:'Seja direto e conciso.'},
  pensar:{name:'TRUX Pensar',desc:'Raciocínio mais profundo para problemas difíceis',icon:'bulb',tier:'complex',extra:'Analise o problema com cuidado, passo a passo, antes de responder, e apresente o raciocínio relevante de forma organizada.'},
  code:{name:'TRUX Code',desc:'Especialista em programação',icon:'code',tier:'default',extra:'Você é especialista em programação. Entregue código completo e correto em blocos com a linguagem indicada, seguido de uma explicação curta e dos casos de borda importantes.'}
};
const SUGS=[
  {ic:'sparkle',t:'Explicar um conceito',d:'Explique computação quântica de forma simples'},
  {ic:'code',t:'Escrever código',d:'Escreva uma função JavaScript que valide CPF'},
  {ic:'image',t:'Criar uma imagem',d:'Uma cidade cyberpunk ao entardecer, estilo cinematográfico',img:true},
  {ic:'globe',t:'Pesquisar na web',d:'Quais as principais notícias de tecnologia hoje?'}
];
const TEXT_EXT=/\.(txt|md|csv|json|js|ts|tsx|jsx|py|html|css|xml|ya?ml|sql|java|c|cpp|go|rs|sh|log|php|rb|kt|swift)$/i;

/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=(n,c='ic')=>`<svg class="${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const trunc=(s,n)=>{s=String(s).replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1).trimEnd()+'…':s};
const mem={};
const store={
  get(k){try{const v=localStorage.getItem(k);if(v!==null)return v}catch(e){}return k in mem?mem[k]:null},
  set(k,v){mem[k]=v;try{localStorage.setItem(k,v)}catch(e){}},
  del(k){delete mem[k];try{localStorage.removeItem(k)}catch(e){}}
};
const getJSON=(k,d)=>{try{const v=store.get(k);return v?JSON.parse(v):d}catch(e){return d}};
const setJSON=(k,v)=>store.set(k,JSON.stringify(v,(key,val)=>key.startsWith('_')?undefined:val));
const isCoarse=()=>matchMedia('(pointer:coarse)').matches;
const isMobile=()=>matchMedia('(max-width:820px)').matches;

const S={user:null,chats:[],activeId:null,model:'rapido',theme:'dark',streaming:null,imageMode:false,attachments:[],search:'',sample:null,imageCaps:null,rec:null,speakingId:null,authMode:'login',stick:true};

/* ================= toast / popovers ================= */
let toastT;
function toast(msg){ $('.toast')?.remove(); const t=document.createElement('div'); t.className='toast'; t.setAttribute('role','status'); t.textContent=msg; document.body.appendChild(t); clearTimeout(toastT); toastT=setTimeout(()=>t.remove(),3200); }
let pop=null;
function closePop(){ if(pop){ pop._anchor?.setAttribute?.('aria-expanded','false'); pop.remove(); pop=null; } }
function openPop(html,anchor,o={}){
  if(pop&&pop._anchor===anchor){closePop();return null}
  closePop();
  const el=document.createElement('div'); el.className='pop'; el.setAttribute('role','menu'); el.innerHTML=html; if(o.width) el.style.width=o.width+'px';
  document.body.appendChild(el); el._anchor=anchor; anchor.setAttribute?.('aria-expanded','true');
  const r=anchor.getBoundingClientRect(), w=el.offsetWidth, h=el.offsetHeight;
  let x=o.right?r.right-w:r.left, y=o.above?r.top-h-8:r.bottom+8;
  x=Math.max(8,Math.min(x,innerWidth-w-8));
  if(y+h>innerHeight-8) y=Math.max(8,r.top-h-8);
  if(y<8) y=8;
  el.style.left=x+'px'; el.style.top=y+'px'; pop=el; return el;
}
document.addEventListener('pointerdown',e=>{ if(pop&&!pop.contains(e.target)&&!e.target.closest('[data-popanchor],.cm')) closePop(); });
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  if(pop){closePop();return}
  const ov=$('.ov'); if(ov){ov.remove();return}
  if($('#app').classList.contains('drawer')) $('#app').classList.remove('drawer');
});
addEventListener('resize',closePop);

/* ================= theme ================= */
function effectiveTheme(){ return S.theme==='system'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):S.theme; }
function applyTheme(){ const r=document.documentElement; if(S.theme==='system') r.removeAttribute('data-theme'); else r.setAttribute('data-theme',S.theme); }
function setTheme(t){ S.theme=t; store.set('trux:theme',t); applyTheme(); $$('.seg [data-theme]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.theme===t)); }

/* ================= auth (accounts live in this browser) ================= */
const users=()=>getJSON('trux:users',[]);
const saveUsers=u=>setJSON('trux:users',u);
function randHex(n){ try{ return [...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join('') }catch(e){ return Array.from({length:n},()=>Math.floor(Math.random()*256).toString(16).padStart(2,'0')).join('') } }
async function hashPw(pw,salt){
  try{
    const enc=new TextEncoder();
    const key=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);
    const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:120000,hash:'SHA-256'},key,256);
    return [...new Uint8Array(bits)].map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ let h=5381; const s=salt+pw; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))|0; return 'x'+(h>>>0).toString(16); }
}
function setAuthMode(m){
  S.authMode=m; const su=m==='signup';
  $('#aTitle').textContent=su?'Crie sua conta':'Bem-vindo de volta';
  $('#aSub').textContent=su?'Comece a conversar com a TRUX AI em segundos.':'Entre na sua conta para continuar na TRUX AI.';
  $('#aNameWrap').hidden=!su; $('#aBtn').textContent=su?'Criar conta':'Continuar';
  $('#aSwapTxt').textContent=su?'Já tem uma conta?':'Não tem uma conta?'; $('#aSwap').textContent=su?'Entrar':'Criar conta';
  $('#aPass').placeholder=su?'Mínimo de 8 caracteres':'Sua senha'; $('#aPass').autocomplete=su?'new-password':'current-password';
  $('#aErr').textContent='';
}
$('#aSwap').onclick=()=>setAuthMode(S.authMode==='login'?'signup':'login');
$('#aEye').onclick=()=>{ const i=$('#aPass'), show=i.type==='password'; i.type=show?'text':'password'; $('#aEye').innerHTML=ic(show?'eyeoff':'eye','ic sm'); $('#aEye').setAttribute('aria-label',show?'Ocultar senha':'Mostrar senha'); };
$('#aForm').onsubmit=async e=>{
  e.preventDefault();
  const err=$('#aErr'), btn=$('#aBtn'); err.textContent='';
  const email=$('#aEmail').value.trim().toLowerCase(), pw=$('#aPass').value, name=$('#aName').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){err.textContent='Digite um e-mail válido.';$('#aEmail').focus();return}
  if(S.authMode==='signup'){
    if(name.length<2){err.textContent='Digite seu nome.';$('#aName').focus();return}
    if(pw.length<8){err.textContent='A senha precisa ter no mínimo 8 caracteres.';$('#aPass').focus();return}
  }else if(!pw){err.textContent='Digite sua senha.';$('#aPass').focus();return}
  btn.disabled=true;
  try{
    const list=users();
    if(S.authMode==='signup'){
      if(list.some(u=>u.email===email)){err.textContent='Já existe uma conta com esse e-mail. Tente entrar.';return}
      const salt=randHex(12), u={id:uid(),name,email,salt,hash:await hashPw(pw,salt)};
      list.push(u); saveUsers(list); store.set('trux:session',u.id); enterApp(u);
    }else{
      const u=list.find(x=>x.email===email);
      if(!u||u.hash!==await hashPw(pw,u.salt)){err.textContent='E-mail ou senha incorretos.';return}
      store.set('trux:session',u.id); enterApp(u);
    }
  }finally{btn.disabled=false}
};

/* ================= AI access ================= */
S.samplePromise=(async()=>{
  try{
    const s=await (window.claude&&window.claude.use?window.claude.use('sample'):null);
    S.sample=s||null;
    if(s&&s.limits){ try{ const l=await s.limits(); S.imageCaps=l.images||null; }catch(e){} }
    return S.sample;
  }catch(e){ S.sample=null; return null; }
})();
function errText(code){
  return ({
    not_granted:'Você precisa permitir o uso do Claude por este app. Envie a mensagem de novo e aceite o pedido.',
    sampling_disabled:'A IA não está disponível para esta conta no momento.',
    rate_limited:'Muitas solicitações ou limite de uso atingido. Aguarde um pouco e tente de novo.',
    session_expired:'Sua sessão expirou. Entre de novo no Claude e tente outra vez.',
    refused:'A IA não pôde responder a esse pedido. Tente reformular.',
    empty_completion:'A IA não gerou resposta. Tente reformular a pergunta.',
    prompt_too_large:'A conversa ficou grande demais. Comece um novo chat.',
    image_rejected:'Não foi possível usar essa imagem. Tente outro arquivo.',
    bad_image:'Não foi possível carregar a imagem.'
  })[code]||'Algo deu errado ao falar com a IA. Tente novamente.';
}

/* ================= data ================= */
const chatsKey=()=>'trux:chats:'+S.user.id;
let saveT;
function save(now){ clearTimeout(saveT); const go=()=>setJSON(chatsKey(),S.chats); now?go():(saveT=setTimeout(go,250)); }

/* ================= sidebar ================= */
function groupLabel(ts){
  const d=new Date(ts), n=new Date(), a=new Date(n.getFullYear(),n.getMonth(),n.getDate()).getTime(), b=new Date(d.getFullYear(),d.getMonth(),d.getDate()).getTime();
  const diff=Math.round((a-b)/864e5); return diff<=0?'Hoje':diff===1?'Ontem':diff<=7?'Últimos 7 dias':'Anteriores';
}
function renderSidebar(){
  const q=S.search.trim().toLowerCase();
  let list=S.chats.filter(c=>c.messages.length).sort((a,b)=>b.updated-a.updated);
  if(q) list=list.filter(c=>c.title.toLowerCase().includes(q)||c.messages.some(m=>(m.content||m.prompt||'').toLowerCase().includes(q)));
  const box=$('#chats');
  if(!list.length){ box.innerHTML=`<div class="empty">${q?'Nenhuma conversa encontrada.':'Suas conversas aparecem aqui.'}</div>`; return; }
  let html='',last='';
  for(const c of list){
    const g=groupLabel(c.updated);
    if(g!==last){html+=`<div class="grp">${g}</div>`;last=g}
    html+=`<div class="ci${c.id===S.activeId?' on':''}" data-id="${c.id}" role="button" tabindex="0"><span class="ct">${esc(c.title)}</span><button class="cm" aria-label="Opções da conversa" aria-haspopup="menu">${ic('dots')}</button></div>`;
  }
  box.innerHTML=html;
}
$('#search').oninput=e=>{S.search=e.target.value;renderSidebar()};
$('#chats').addEventListener('click',e=>{
  const item=e.target.closest('.ci'); if(!item||e.target.closest('input')) return;
  const id=item.dataset.id;
  if(e.target.closest('.cm')){ chatMenu(id,e.target.closest('.cm')); return; }
  openChat(id);
});
$('#chats').addEventListener('keydown',e=>{ if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('ci')){e.preventDefault();openChat(e.target.dataset.id)} });
function chatMenu(id,anchor){
  const p=openPop(`<button class="pi" data-a="ren">${ic('pen')}<span class="t">Renomear</span></button><button class="pi danger" data-a="del">${ic('trash')}<span class="t">Apagar</span></button>`,anchor,{right:true,width:200});
  if(!p) return;
  p.onclick=e=>{
    const b=e.target.closest('.pi'); if(!b) return;
    if(b.dataset.a==='ren'){ closePop(); startRename(id); }
    else if(!b.dataset.sure){ b.dataset.sure=1; b.innerHTML=`${ic('trash')}<span class="t">Confirmar exclusão</span>`; }
    else { closePop(); deleteChat(id); }
  };
}
function startRename(id){
  const c=S.chats.find(x=>x.id===id), item=$(`.ci[data-id="${id}"]`); if(!c||!item) return;
  const t=$('.ct',item), inp=document.createElement('input'); inp.value=c.title; inp.maxLength=80; inp.setAttribute('aria-label','Novo nome da conversa');
  t.replaceWith(inp); $('.cm',item).hidden=true; inp.focus(); inp.select();
  let done=false; const fin=ok=>{ if(done) return; done=true; if(ok&&inp.value.trim()){c.title=inp.value.trim();c.titled=true;save(true)} renderSidebar(); };
  inp.onkeydown=e=>{ if(e.key==='Enter')fin(true); else if(e.key==='Escape')fin(false); e.stopPropagation(); };
  inp.onblur=()=>fin(true); inp.onclick=e=>e.stopPropagation();
}
function deleteChat(id){
  if(S.streaming?.chatId===id) abortStream();
  S.chats=S.chats.filter(c=>c.id!==id); save(true);
  if(S.activeId===id){S.activeId=null;renderMain()}
  renderSidebar(); toast('Conversa apagada.');
}

/* ================= markdown ================= */
if(window.marked) marked.setOptions({gfm:true,breaks:false,headerIds:false,mangle:false});
function renderMd(el,text){
  let html;
  try{ html=window.marked&&window.DOMPurify?DOMPurify.sanitize(marked.parse(text)):esc(text).replace(/\n/g,'<br>'); }
  catch(e){ html=esc(text).replace(/\n/g,'<br>'); }
  el.innerHTML=html;
  $$('a',el).forEach(a=>{a.target='_blank';a.rel='noopener noreferrer'});
  $$('pre',el).forEach(pre=>{
    const code=$('code',pre), lang=(code?.className.match(/language-([\w+#-]+)/)||[])[1]||'texto';
    const w=document.createElement('div'); w.className='codeblock';
    w.innerHTML=`<div class="chead"><span>${esc(lang)}</span><button class="cbtn" data-copycode>Copiar</button></div>`;
    pre.replaceWith(w); w.appendChild(pre);
  });
  $$('table',el).forEach(t=>{ const w=document.createElement('div'); w.className='tw'; t.replaceWith(w); w.appendChild(t); });
}
async function copyText(t){
  try{ await navigator.clipboard.writeText(t); return true; }catch(e){}
  try{ const a=document.createElement('textarea'); a.value=t; a.style.cssText='position:fixed;opacity:0;top:0'; document.body.appendChild(a); a.select(); const ok=document.execCommand('copy'); a.remove(); return ok; }catch(e){ return false; }
}

/* ================= message rendering ================= */
const dataUrl=svg=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
function userEl(m){
  const d=document.createElement('div'); d.className='msg u'; d.dataset.mid=m.id; let h='';
  if(m.mode==='image') h+=`<div class="tag">${ic('image')}Imagem</div>`;
  if(m.attach?.length) h+=`<div class="atts">${m.attach.map(a=>a.thumb?`<img class="athumb" src="${esc(a.thumb)}" alt="${esc(a.name)}">`:`<span class="achip">${ic('file','ic sm')}<span>${esc(a.name)}</span></span>`).join('')}</div>`;
  if(m.content) h+=`<div class="bubble">${esc(m.content)}</div>`;
  d.innerHTML=h; return d;
}
function actionsHtml(m,isLast){
  if(m.pending) return '';
  let h='';
  if(m.kind!=='image'&&m.content){ h+=`<button class="iconbtn" data-act="copy" aria-label="Copiar resposta">${ic('copy')}</button>`; }
  if(isLast) h+=`<button class="iconbtn" data-act="regen" aria-label="Gerar novamente">${ic('refresh')}</button>`;
  if(m.kind!=='image'&&m.content) h+=`<button class="iconbtn${S.speakingId===m.id?' on':''}" data-act="speak" aria-label="Ler em voz alta">${ic('volume')}</button>`;
  return h?`<div class="acts">${h}</div>`:'';
}
function imageBody(m){
  const cap=`<div class="cap"><span>${esc(m.prompt)}</span>`;
  if(m.pending) return `<div class="imgcard loading"><div class="shim"></div><div class="imglabel">${ic('image','ic sm')}Criando imagem…</div>${cap}</div></div>`;
  if(m.error||!m.svg) return `<div class="imgcard"><div class="imgmid">${ic('alert','ic lg')}<span>${esc(m.error||errText('bad_image'))}</span></div>${cap}</div></div>`;
  return `<div class="imgcard"><img class="gen" alt="${esc(m.prompt)}" src="${dataUrl(m.svg)}">${cap}<button class="open" data-act="open">${ic('ext','ic sm')}Abrir</button></div></div>`;
}
function fillBot(d,m,isLast){
  const body=$('.body',d);
  if(m.kind==='image'){ body.innerHTML=imageBody(m)+actionsHtml(m,isLast); return; }
  body.innerHTML=`<div class="md"></div><div class="note"></div>${actionsHtml(m,isLast)}`;
  paintText(d,m);
}
function paintText(d,m){
  const md=$('.md',d), note=$('.note',d); if(!md) return;
  if(!m.content&&m.pending) md.innerHTML='<div class="think" aria-label="Pensando"><i></i><i></i><i></i></div>';
  else if(m.content) renderMd(md,m.content); else md.innerHTML='';
  let n='';
  if(m.error) n=`<div class="errbox">${ic('alert','ic sm')}<span>${esc(m.error)}</span></div>`;
  else if(m.stopped) n='Resposta interrompida.';
  else if(m.truncated) n='A resposta foi cortada pelo limite de tamanho. Peça para continuar.';
  note.innerHTML=n; note.hidden=!n;
}
function botEl(m,isLast){
  const d=document.createElement('div'); d.className='msg b'; d.dataset.mid=m.id;
  d.innerHTML=`<div class="mark sm">T</div><div class="body"></div>`; fillBot(d,m,isLast); return d;
}
function renderMessages(){
  const c=active(), box=$('#msgs'); box.innerHTML='';
  if(!c) return;
  c.messages.forEach((m,i)=>box.appendChild(m.role==='user'?userEl(m):botEl(m,i===c.messages.length-1)));
}
function refreshMsg(m){
  const c=active(); if(!c) return; const i=c.messages.indexOf(m); const el=$(`[data-mid="${m.id}"]`); if(!el||i<0) return;
  el.replaceWith(botEl(m,i===c.messages.length-1));
}
let paintQ=null;
function streamPaint(m){
  if(paintQ) return; paintQ=requestAnimationFrame(()=>{ paintQ=null; const el=$(`[data-mid="${m.id}"]`); if(!el) return; paintText(el,m); if(S.stick) scrollBottom(); });

function scrollBottom(force){ const s=$('#scroll'); if(force) S.stick=true; s.scrollTop=s.scrollHeight; }
$('#scroll').addEventListener('scroll',()=>{ const s=$('#scroll'); S.stick=s.scrollHeight-s.scrollTop-s.clientHeight<90; },{passive:true});

$('#msgs').addEventListener('click',async e=>{

/* ================= speech ================= */
function speak(m,el){
  if(!('speechSynthesis' in window)){ toast('Leitura em voz alta indisponível neste navegador.'); return; }
  const was=S.speakingId===m.id; speechSynthesis.cancel(); S.speakingId=null;
  const btn=$('[data-act="speak"]',el);
  if(was){ btn?.classList.remove('on'); return; }
  const tmp=document.createElement('div'); renderMd(tmp,m.content);
  tmp.querySelectorAll('.chead').forEach(x=>x.remove());
  const u=new SpeechSynthesisUtterance(tmp.textContent.replace(/\s+/g,' ').trim()); u.lang='pt-BR';
  u.onend=u.onerror=()=>{ if(S.speakingId===m.id){S.speakingId=null;$('[data-act="speak"]',$(`[data-mid="${m.id}"]`)||document)?.classList.remove('on')} };
  S.speakingId=m.id; btn?.classList.add('on'); speechSynthesis.speak(u);
}
function toggleMic(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ toast('Ditado por voz indisponível neste navegador.'); return; }
  if(S.rec){ S.rec.stop(); return; }
  const ta=$('#ta'), r=new SR(), base=ta.value; r.lang='pt-BR'; r.interimResults=true; r.continuous=false;
  r.onresult=e=>{ let t=''; for(const x of e.results) t+=x[0].transcript; ta.value=(base?base+' ':'')+t; autosize(); updateSend(); };
  r.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'O microfone está bloqueado neste ambiente.':'Não foi possível usar o microfone.');
  r.onend=()=>{ S.rec=null; $('#mic').classList.remove('on'); };
  try{ r.start(); S.rec=r; $('#mic').classList.add('on'); }catch(e){ toast('Não foi possível usar o microfone.'); }
}
$('#mic').onclick=toggleMic;

async function thumbOf(file){
  try{
    const bmp=await createImageBitmap(file), k=Math.min(1,320/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(bmp.width*k)); c.height=Math.max(1,Math.round(bmp.height*k));
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.72);
  }catch(e){ return null; }
}
$('#file').onchange=async e=>{
  const files=[...e.target.files]; e.target.value='';
  for(const f of files){
    if(S.attachments.length>=5){ toast('Você pode anexar até 5 arquivos por mensagem.'); break; }
    if(f.type.startsWith('image/')){
      const caps=S.imageCaps; await S.samplePromise;
      if(!S.imageCaps){ toast('Anexar imagens não está disponível aqui.'); continue; }
      if(S.attachments.filter(a=>a.blob).length>=S.imageCaps.maxCount){ toast(`Você pode enviar até ${S.imageCaps.maxCount} imagens por mensagem.`); continue; }
      if(S.imageCaps.mediaTypes&&!S.imageCaps.mediaTypes.includes(f.type)){ toast('Esse tipo de imagem não é aceito. Use JPG, PNG, WebP ou GIF.'); continue; }
      S.attachments.push({name:f.name,blob:f,thumb:await thumbOf(f)});
    }else if(f.type.startsWith('text/')||TEXT_EXT.test(f.name)||f.type==='application/json'){
      if(f.size>2e6){ toast(`"${f.name}" é grande demais (máx. 2 MB).`); continue; }
      let t=await f.text(); const cut=t.length>60000; if(cut) t=t.slice(0,60000);
      S.attachments.push({name:f.name,text:t,cut});
    }else toast(`Não consigo ler "${f.name}". Use imagens ou arquivos de texto e código.`);
  }
  renderChips(); updateSend();
};
addEventListener('paste',e=>{ if(!S.user||$('.ov')) return; const fs=[...(e.clipboardData?.files||[])].filter(f=>f.type.startsWith('image/')); if(fs.length){ e.preventDefault(); const dt=new DataTransfer(); fs.forEach(f=>dt.items.add(f)); $('#file').files=dt.files; $('#file').dispatchEvent(new Event('change')); } });

/* ================= generation ================= */
function systemText(){
  const first=S.user.name.split(' ')[0];
  return `Você é a TRUX AI, uma assistente de IA dentro do app TRUX. Converse com ${first} no mesmo idioma em que a pessoa escrever (padrão: português do Brasil). Use Markdown quando ajudar: títulos curtos, listas, tabelas e blocos de código com a linguagem indicada. Você não tem acesso à internet nem a notícias em tempo real: quando pedirem algo atual, diga isso com clareza e ofereça o que sabe, avisando que pode estar desatualizado. Se perguntarem qual modelo está por trás da TRUX AI, diga que ela é movida por um modelo de IA da Anthropic (Claude). ${MODELS[S.model].extra}`;
}
function buildTurns(chat,upto){
  const turns=[];
  for(const m of chat.messages.slice(0,upto)){
    if(m.role==='user'){
      let c=m.content||''; if(m.ctx) c+=(c?'\n\n':'')+m.ctx;
      if(m.attach?.some(a=>a.thumb)&&!m._blobs) c+=(c?'\n\n':'')+'(Havia imagem anexada nesta mensagem, que não está mais disponível.)';
      if(m.mode==='image') c='(Pedido de imagem) '+c;
      turns.push({role:'user',content:c||'(vazio)'});
    }else if(m.kind==='image') turns.push({role:'assistant',content:m.svg?`[Imagem gerada a partir do pedido: ${m.prompt}]`:'[Falha ao gerar a imagem]'});
    else if(m.content) turns.push({role:'assistant',content:m.content});
  }
  let total=turns.reduce((n,t)=>n+t.content.length,0);
  while(total>180000&&turns.length>1){ total-=turns.shift().content.length; }
  while(turns.length&&turns[0].role!=='user') turns.shift();
  return [{role:'user',content:systemText()},...turns];
}
async function send(text,o={}){
  if(S.streaming) return;
  text=(text!==undefined?text:ta.value).trim();
  const image=o.image!==undefined?o.image:S.imageMode;
  if(!text&&!(S.attachments.length&&!image)) return;
  await S.samplePromise;
  if(!S.sample){ toast('A IA só funciona quando este app é aberto pelo Claude.'); return; }
  let chat=active();
  if(!chat){ chat={id:uid(),title:'Nova conversa',created:Date.now(),updated:Date.now(),model:S.model,messages:[]}; S.chats.unshift(chat); S.activeId=chat.id; }
  const atts=image?[]:S.attachments.splice(0);
  const um={id:uid(),role:'user',content:text,mode:image?'image':undefined,ts:Date.now()};
  if(atts.length){
    um.attach=atts.map(a=>({name:a.name,thumb:a.thumb||null}));
    const tx=atts.filter(a=>a.text).map(a=>`[Arquivo anexado: ${a.name}${a.cut?' (truncado)':''}]\n\`\`\`\n${a.text.slice(0,30000)}\n\`\`\``);
    if(tx.length) um.ctx=tx.join('\n\n');
    um._blobs=atts.filter(a=>a.blob).map(a=>a.blob);
    um._ctxFull=atts.filter(a=>a.text).map(a=>`[Arquivo anexado: ${a.name}]\n\`\`\`\n${a.text}\n\`\`\``).join('\n\n');
  }
  chat.messages.push(um); chat.updated=Date.now(); chat.model=S.model;
  if(chat.title==='Nova conversa') chat.title=trunc(text||(atts[0]?.name)||'Nova conversa',42);
  if(o.image===undefined) { S.imageMode=false; }
  ta.value=''; autosize(); renderChips(); $('#welcome').hidden=true; $('#msgs').hidden=false;
  renderSidebar(); save(true); generate(chat);
}
async function generate(chat){
  const last=chat.messages[chat.messages.length-1];
  if(last.mode==='image') await runImage(chat,last); else await runText(chat,last);
}
function lockUi(chat){ S.streaming={chatId:chat.id,ctl:new AbortController()}; updateSend(); return S.streaming.ctl; }
function unlockUi(){ S.streaming=null; updateSend(); }
async function runText(chat,um){
  const ctl=lockUi(chat), model=S.model;
  const m={id:uid(),role:'assistant',content:'',pending:true,model}; chat.messages.push(m); renderMessages(); scrollBottom(true);
  const turns=buildTurns(chat,chat.messages.length-1);
  if(um._ctxFull){ turns[turns.length-1].content=(um.content||'')+'\n\n'+um._ctxFull; }
  const opts={cache:false,signal:ctl.signal,modelTier:MODELS[model].tier,onText:({text})=>{m.content=text;streamPaint(m)}};
  if(um._blobs?.length) opts.images=um._blobs;
  try{
    const r=await S.sample(turns,opts); m.content=r.text; m.truncated=r.truncated;
  }catch(e){
    if(e&&e.text) m.content=e.text;
    if(e&&e.code==='cancelled'){ m.stopped=true; }
    else { m.error=errText(e&&e.code); if(e&&e.code==='refused') m.content=''; }
  }
  m.pending=false;
  if(m.stopped&&!m.content){ chat.messages.pop(); }
  unlockUi(); chat.updated=Date.now(); save(true);
  if(S.activeId===chat.id){ if(chat.messages.includes(m)) refreshMsg(m); else renderMessages(); if(S.stick) scrollBottom(); }
  renderSidebar();
  if(m.content&&!m.error&&!chat.titled&&chat.messages.length<=2) makeTitle(chat);
}
const IMG_PROMPT=p=>`Crie uma ilustração em SVG para o pedido abaixo.
Regras: responda SOMENTE com o código <svg>…</svg>, sem Markdown e sem explicações. Use viewBox="0 0 1024 1024". Não use <script>, <style>, <image>, <foreignObject>, <use>, fontes nem texto. Use apenas atributos de apresentação inline, linearGradient/radialGradient, filtros simples (feGaussianBlur) e formas. Faça uma composição rica: fundo completo, profundidade em camadas, iluminação, detalhes e paleta harmoniosa. O design deve ser original (não reproduza personagens, marcas ou obras protegidas).

Pedido: ${p}`;
function cleanSvg(raw){
  if(!window.DOMPurify) return null;
  const mm=String(raw).match(/<svg[\s\S]*<\/svg>/i); if(!mm) return null;
  try{
    const s=DOMPurify.sanitize(mm[0],{USE_PROFILES:{svg:true,svgFilters:true}});
    const doc=new DOMParser().parseFromString(s,'image/svg+xml'), svg=doc.documentElement;
    if(!svg||svg.nodeName.toLowerCase()!=='svg'||doc.querySelector('parsererror')) return null;
    svg.setAttribute('xmlns','http://www.w3.org/2000/svg');
    if(!svg.getAttribute('viewBox')) svg.setAttribute('viewBox','0 0 1024 1024');
    svg.setAttribute('width','1024'); svg.setAttribute('height','1024');
    return new XMLSerializer().serializeToString(svg);
  }catch(e){ return null; }
}
async function runImage(chat,um){
  const ctl=lockUi(chat), prompt=um.content;
  const m={id:uid(),role:'assistant',kind:'image',prompt,pending:true}; chat.messages.push(m); renderMessages(); scrollBottom(true);
  try{
    const r=await S.sample(IMG_PROMPT(prompt),{cache:false,signal:ctl.signal,modelTier:'default'});
    const svg=cleanSvg(r.text); if(!svg) throw {code:'bad_image'}; m.svg=svg;
  }catch(e){
    if(e&&e.code==='cancelled') m.cancelled=true; else m.error=errText(e&&e.code);
  }
  m.pending=false;
  if(m.cancelled) chat.messages.pop();
  unlockUi(); chat.updated=Date.now(); save(true);
  if(S.activeId===chat.id){ if(chat.messages.includes(m)) refreshMsg(m); else renderMessages(); scrollBottom(true); }
  renderSidebar();
}
function regen(){
  const chat=active(); if(!chat||S.streaming) return;
  while(chat.messages.length&&chat.messages[chat.messages.length-1].role==='assistant') chat.messages.pop();
  if(!chat.messages.length) return; save(true); generate(chat);
}
async function makeTitle(chat){
  chat.titled=true;
  const q=chat.messages.find(x=>x.role==='user')?.content||'', a=chat.messages.find(x=>x.role==='assistant')?.content||'';
  if(!q||!a) return;
  try{
    const r=await S.sample('Escreva um título curto em português (2 a 4 palavras, iniciais maiúsculas, sem aspas e sem ponto final) para esta conversa. Responda apenas com o título.\n\nUsuário: '+q.slice(0,500)+'\n\nAssistente: '+a.slice(0,500),{modelTier:'quick',cache:false});
    const t=r.text.trim().split('\n')[0].replace(/^["'“”‘’*#\s]+|["'“”‘’.*\s]+$/g,'').slice(0,60);
    if(t&&S.chats.includes(chat)){ chat.title=t; save(); renderSidebar(); }
  }catch(e){}
}

/* ================= lightbox & downloads ================= */
async function savePng(m){
  try{
    const img=new Image(); img.src=dataUrl(m.svg); await img.decode();
    const c=document.createElement('canvas'); c.width=c.height=1024; c.getContext('2d').drawImage(img,0,0,1024,1024);
    const blob=await new Promise(r=>c.toBlob(r,'image/png'));
    await saveFile('trux-imagem.png',blob);
  }catch(e){ toast('Não foi possível gerar o PNG.'); }
}
async function saveFile(name,data){
  try{
    const dl=await (window.claude&&window.claude.use?window.claude.use('downloads'):null);
    if(!dl){ toast('Download indisponível neste ambiente.'); return; }
    await dl.save({filename:name,data}); toast('Arquivo salvo.');
  }catch(e){ if(e&&e.code!=='declined') toast('Não foi possível salvar o arquivo.'); }
}
function openLightbox(m){
  if(!m.svg) return;
  const ov=document.createElement('div'); ov.className='ov'; ov.setAttribute('role','dialog'); ov.setAttribute('aria-label','Imagem gerada');
  ov.innerHTML=`<div class="lb"><img src="${dataUrl(m.svg)}" alt="${esc(m.prompt)}"><div class="bar"><button class="btn sm" data-a="png">${ic('download','ic sm')} Baixar PNG</button><button class="btn sm ghost" data-a="svg">SVG</button><button class="btn sm ghost" data-a="x">Fechar</button></div></div>`;
  ov.onclick=e=>{ const a=e.target.closest('[data-a]')?.dataset.a;
    if(a==='png') savePng(m); else if(a==='svg') saveFile('trux-imagem.svg',m.svg); else if(a==='x'||e.target===ov) ov.remove(); };
  document.body.appendChild(ov); $('[data-a="x"]',ov).focus();
}

/* ================= user menu & settings ================= */
$('#meBtn').onclick=e=>{
  const dark=effectiveTheme()==='dark';
  const p=openPop(`<button class="pi" data-a="set">${ic('sliders')}<span class="t">Configurações</span></button><button class="pi" data-a="theme">${ic(dark?'sun':'moon')}<span class="t">${dark?'Tema claro':'Tema escuro'}</span></button><a class="pi" href="${DISCORD_URL}" target="_blank" rel="noopener noreferrer" style="text-decoration:none;color:inherit">${ic('users')}<span class="t">Comunidade no Discord</span></a><div class="psep"></div><button class="pi danger" data-a="out">${ic('out')}<span class="t">Sair</span></button>`,e.currentTarget,{above:true,width:Math.max(236,e.currentTarget.offsetWidth)});
  if(!p) return;
  p.onclick=ev=>{ const b=ev.target.closest('.pi'); if(!b) return; const a=b.dataset.a; closePop();
    if(a==='set') openSettings(); else if(a==='theme') setTheme(dark?'light':'dark'); else if(a==='out') logout(); };
};
function openSettings(){
  $('.ov')?.remove();
  const ov=document.createElement('div'); ov.className='ov';
  ov.innerHTML=`<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="stT">
    <div class="dh"><h3 id="stT">Configurações</h3><button class="iconbtn" data-a="x" aria-label="Fechar">${ic('x')}</button></div>
    <div class="sec"><h4>Perfil</h4>
      <label class="fl" for="setName">Nome</label><input class="inp" id="setName" value="${esc(S.user.name)}" maxlength="60" autocomplete="name">
      <label class="fl" for="setEmail">E-mail</label><input class="inp" id="setEmail" value="${esc(S.user.email)}" readonly>
      <button class="btn sm" data-a="name">Salvar nome</button><div class="fmsg" id="nameMsg"></div></div>
    <div class="sec"><h4>Aparência</h4>
      <div class="row"><div class="t"><b>Tema</b><span>Escolha como a TRUX AI aparece para você.</span></div>
      <div class="seg" role="group" aria-label="Tema">${[['dark','Escuro'],['light','Claro'],['system','Sistema']].map(([k,l])=>`<button data-theme="${k}" aria-pressed="${S.theme===k}">${l}</button>`).join('')}</div></div></div>
    <div class="sec"><h4>Segurança</h4>
      <label class="fl" for="setCur">Senha atual</label><input class="inp" id="setCur" type="password" autocomplete="current-password">
      <label class="fl" for="setNew">Nova senha</label><input class="inp" id="setNew" type="password" autocomplete="new-password" placeholder="Mínimo de 8 caracteres">
      <button class="btn sm ghost" data-a="pw">Alterar senha</button><div class="fmsg" id="pwMsg"></div></div>
    <div class="sec"><h4>Dados</h4>
      <div class="row"><div class="t"><b>Apagar todas as conversas</b><span>Remove o histórico salvo neste navegador.</span></div><button class="btn sm danger" style="margin:0" data-a="wipe">Apagar</button></div></div>
  </div>`;
  ov.onclick=async e=>{
    if(e.target===ov){ov.remove();return}
    const th=e.target.closest('[data-theme]'); if(th){ setTheme(th.dataset.theme); return; }
    const a=e.target.closest('[data-a]')?.dataset.a; if(!a) return;
    const msg=(id,t,ok)=>{const el=$('#'+id,ov);el.textContent=t;el.className='fmsg '+(ok?'good':'bad')};
    if(a==='x') ov.remove();
    else if(a==='name'){
      const n=$('#setName',ov).value.trim(); if(n.length<2){msg('nameMsg','Digite um nome com pelo menos 2 letras.');return}
      const list=users(), u=list.find(x=>x.id===S.user.id); if(u){u.name=n;saveUsers(list)} S.user.name=n;
      $('#meName').textContent=n; $('#meAv').textContent=n[0].toUpperCase(); if(!active()) renderMain(); msg('nameMsg','Nome atualizado.',true);
    }else if(a==='pw'){
      const cur=$('#setCur',ov).value, nw=$('#setNew',ov).value;
      if(!cur){msg('pwMsg','Digite sua senha atual.');return}
      if(nw.length<8){msg('pwMsg','A nova senha precisa ter no mínimo 8 caracteres.');return}
      const list=users(), u=list.find(x=>x.id===S.user.id);
      if(!u||u.hash!==await hashPw(cur,u.salt)){msg('pwMsg','A senha atual está incorreta.');return}
      u.salt=randHex(12); u.hash=await hashPw(nw,u.salt); saveUsers(list); S.user=u;
      $('#setCur',ov).value=''; $('#setNew',ov).value=''; msg('pwMsg','Senha alterada.',true);
    }else if(a==='wipe'){
      const b=e.target.closest('[data-a]');
      if(!b.dataset.sure){ b.dataset.sure=1; b.textContent='Confirmar'; setTimeout(()=>{ if(b.isConnected){delete b.dataset.sure;b.textContent='Apagar'} },5000); return; }
      abortStream(); S.chats=[]; S.activeId=null; save(true); renderSidebar(); renderMain(); b.textContent='Apagado'; b.disabled=true; toast('Todas as conversas foram apagadas.');
    }
  };
  document.body.appendChild(ov); $('#setName',ov).focus();
}

/* ================= boot ================= */
(function boot(){
  S.theme=['dark','light','system'].includes(store.get('trux:theme'))?store.get('trux:theme'):'dark'; applyTheme();
  document.querySelector('.discord').href=DISCORD_URL;
  const u=users().find(x=>x.id===store.get('trux:session'));
  if(u) enterApp(u); else { $('#auth').hidden=false; setAuthMode('login'); }
})();
})();
